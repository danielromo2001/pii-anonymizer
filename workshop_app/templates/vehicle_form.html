{% extends "base.html" %}
{% block title %}Nuevo vehículo · Taller El Motor{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Nuevo vehículo</h1>
    <p class="muted">Asocia el vehículo a un cliente existente.</p>
  </div>
  <a class="btn btn-ghost" href="{{ url_for('vehicles') }}">Volver</a>
</div>

<form class="card form-card" method="post">
  <div class="form-grid">
    <label class="span-2">
      Cliente
      <select name="customer_id" required>
        <option value="">Selecciona un cliente</option>
        {% for customer in customers %}
        <option value="{{ customer.id }}" {% if form.get('customer_id')|string == customer.id|string %}selected{% endif %}>
          {{ customer.full_name }} — {{ customer.email }}
        </option>
        {% endfor %}
      </select>
    </label>
    <label>
      Placa
      <input name="plate" value="{{ form.get('plate', '') }}" placeholder="ABC123" required>
    </label>
    <label>
      Año
      <input type="number" name="year" min="1900" max="2100" value="{{ form.get('year', '') }}" required>
    </label>
    <label>
      Marca
      <input name="make" value="{{ form.get('make', '') }}" placeholder="Toyota" required>
    </label>
    <label>
      Modelo
      <input name="model" value="{{ form.get('model', '') }}" placeholder="Corolla" required>
    </label>
    <label class="span-2">
      VIN
      <input name="vin" value="{{ form.get('vin', '') }}" placeholder="JTDBR32E720123456">
      <small class="hint">El VIN se enmascara cuando el modo privacidad está activo.</small>
    </label>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Guardar vehículo</button>
    <a class="btn btn-ghost" href="{{ url_for('vehicles') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
