{% extends "base.html" %}
{% block title %}Nueva orden · Taller El Motor{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Nueva orden de trabajo</h1>
    <p class="muted">Registra el servicio solicitado por el cliente.</p>
  </div>
  <a class="btn btn-ghost" href="{{ url_for('work_orders') }}">Volver</a>
</div>

<form class="card form-card" method="post">
  <div class="form-grid">
    <label>
      Cliente
      <select name="customer_id" id="customer_id" required>
        <option value="">Selecciona un cliente</option>
        {% for customer in customers %}
        <option value="{{ customer.id }}" {% if form.get('customer_id')|string == customer.id|string %}selected{% endif %}>
          {{ customer.full_name }} — {{ customer.email }}
        </option>
        {% endfor %}
      </select>
    </label>
    <label>
      Vehículo
      <select name="vehicle_id" id="vehicle_id" required>
        <option value="">Selecciona un vehículo</option>
        {% for vehicle in vehicles %}
        <option value="{{ vehicle.id }}" data-customer="{{ vehicle.customer_id }}" {% if form.get('vehicle_id')|string == vehicle.id|string %}selected{% endif %}>
          {{ vehicle.plate }} — {{ vehicle.make }} {{ vehicle.model }}
        </option>
        {% endfor %}
      </select>
    </label>
    <label>
      Estado
      <select name="status" required>
        {% for status in statuses %}
        <option value="{{ status }}" {% if form.get('status') == status %}selected{% endif %}>{{ status }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Costo estimado (COP)
      <input type="number" name="cost" min="0" step="1000" value="{{ form.get('cost', '0') }}" required>
    </label>
    <label class="span-2">
      Descripción del trabajo
      <textarea name="description" rows="4" required placeholder="Ej. Cambio de aceite y filtros. Contactar a ana.perez@example.com o al 300 123 4567.">{{ form.get('description', '') }}</textarea>
      <small class="hint">Si el texto incluye correos, tarjetas o teléfonos, se enmascaran al activar privacidad.</small>
    </label>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Crear orden</button>
    <a class="btn btn-ghost" href="{{ url_for('work_orders') }}">Cancelar</a>
  </div>
</form>

<script>
  const customerSelect = document.getElementById('customer_id');
  const vehicleSelect = document.getElementById('vehicle_id');
  const allVehicles = Array.from(vehicleSelect.options).map((option) => ({
    value: option.value,
    text: option.textContent,
    customer: option.dataset.customer || '',
  }));

  function filterVehicles() {
    const selectedCustomer = customerSelect.value;
    const currentVehicle = vehicleSelect.value;
    vehicleSelect.innerHTML = '<option value="">Selecciona un vehículo</option>';
    allVehicles
      .filter((vehicle) => vehicle.value && (!selectedCustomer || vehicle.customer === selectedCustomer))
      .forEach((vehicle) => {
        const option = document.createElement('option');
        option.value = vehicle.value;
        option.textContent = vehicle.text;
        option.dataset.customer = vehicle.customer;
        if (vehicle.value === currentVehicle) {
          option.selected = true;
        }
        vehicleSelect.appendChild(option);
      });
  }

  customerSelect.addEventListener('change', filterVehicles);
  filterVehicles();
</script>
{% endblock %}
