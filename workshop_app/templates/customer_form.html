{% extends "base.html" %}
{% block title %}{{ 'Editar cliente' if customer else 'Nuevo cliente' }} · Taller El Motor{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>{{ 'Editar cliente' if customer else 'Nuevo cliente' }}</h1>
    <p class="muted">Los datos se guardan en la base local de demostración.</p>
  </div>
  <a class="btn btn-ghost" href="{{ url_for('customers') }}">Volver</a>
</div>

<form class="card form-card" method="post">
  <div class="form-grid">
    <label>
      Nombre completo
      <input name="full_name" value="{{ form.get('full_name', '') }}" required autofocus>
    </label>
    <label>
      Correo electrónico
      <input type="email" name="email" value="{{ form.get('email', '') }}" required>
    </label>
    <label>
      Teléfono
      <input name="phone" value="{{ form.get('phone', '') }}" required>
    </label>
    <label>
      Documento de identidad
      <input name="document_id" value="{{ form.get('document_id', '') }}" required>
    </label>
    <label class="span-2">
      Dirección
      <input name="address" value="{{ form.get('address', '') }}">
    </label>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Guardar cliente</button>
    <a class="btn btn-ghost" href="{{ url_for('customers') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
